name: bookbuddy

services:
  mongo:
    image: mongo:7
    container_name: bookbuddy-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job that loads the sample data, then exits.
  seed:
    image: mongo:7
    container_name: bookbuddy-seed
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: bookbuddy
      SEED_DIR: /seed
    volumes:
      - ./seed:/seed:ro
      - ./deploy/seed/seed.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]
    restart: "no"

  discovery-service:
    build:
      context: .
      dockerfile: services/discovery-service/Dockerfile
    container_name: bookbuddy-discovery
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: bookbuddy
    ports:
      - "8082:8082"

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: bookbuddy-catalog
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: bookbuddy
    ports:
      - "8081:8081"

  social-service:
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
    container_name: bookbuddy-social
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: bookbuddy
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
    ports:
      - "8083:8083"

  gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: bookbuddy-gateway
    depends_on:
      - catalog-service
      - social-service
      - discovery-service
    environment:
      CATALOG_URI: http://catalog-service:8081
      SOCIAL_URI: http://social-service:8083
      DISCOVERY_URI: http://discovery-service:8082
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookbuddy-frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  mongo-data:
