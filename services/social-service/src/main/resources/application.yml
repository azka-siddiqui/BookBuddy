server:
  port: ${SOCIAL_PORT:8083}

spring:
  application:
    name: social-service
  profiles:
    # Enable the demo data seeder by default for local development.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017}
      database: ${MONGO_DATABASE:bookbuddy}
      auto-index-creation: true

jwt:
  # Base64-encoded 256-bit secret. Override via JWT_SECRET in every environment.
  # This default exists only so the service can start in local development.
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

bookbuddy:
  seed:
    users-location: ${SEED_USERS_LOCATION:classpath:seed/users.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bookbuddy.social: INFO
